<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brick Breaker</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#0f172a;--panel:#1e293b;--fg:#fff;--mut:#94a3b8;--acc:#38bdf8}
:root:not([data-theme="light"]){}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--fg);font-family:'Segoe UI',Tahoma,Verdana,sans-serif;text-align:center;margin:0;padding:16px}
h1{color:var(--acc);margin:0 0 4px}
p{color:var(--mut);margin:0 0 10px}
.controls{display:flex;justify-content:center;align-items:center;gap:12px;margin:10px 0;flex-wrap:wrap}
label{font-weight:bold;color:var(--mut)}
select,button{background:var(--panel);color:var(--acc);border:1px solid var(--acc);padding:6px 12px;border-radius:6px;cursor:pointer;font-weight:bold}
select:focus,button:hover{background:var(--acc);color:var(--bg)}
canvas{background:var(--panel);display:block;margin:0 auto;border:2px solid var(--acc);border-radius:8px;box-shadow:0 10px 25px rgba(0,0,0,.5);max-width:100%;touch-action:none}
</style>
</head>
<body>
<h1>Brick Breaker</h1>
<p>Mouse / touch / arrow keys to move · Click or Space to launch · P to pause</p>
<div class="controls">
  <label for="difficulty">Difficulty:</label>
  <select id="difficulty">
    <option value="easy">Easy</option>
    <option value="medium" selected>Medium</option>
    <option value="hard">Hard</option>
  </select>
  <button id="resetHi">Reset High Score</button>
</div>
<p id="hint"></p>
<canvas id="c" width="520" height="380"></canvas>

<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),W=cv.width,H=cv.height;
const DIFF={
  easy:{s:3,pw:100,l:5,lv:.15,ramp:.015,drop:.22,hpAdd:-1,unb:.5,shrink:0,descend:0},
  medium:{s:4,pw:80,l:3,lv:.25,ramp:.03,drop:.14,hpAdd:0,unb:1,shrink:2,descend:0},
  hard:{s:5.2,pw:60,l:2,lv:.4,ramp:.05,drop:.08,hpAdd:1,unb:1.5,shrink:4,descend:900}
};
const HINTS={
  easy:"Easy: weaker bricks, more power-ups, fewer steel bricks, slow ball.",
  medium:"Medium: balanced. Paddle shrinks slightly each level.",
  hard:"Hard: tougher bricks, rare power-ups, extra steel bricks, fast ball, shrinking paddle, and the bricks keep dropping!"
};
const LAYOUTS=[
  ["xxxxxxx","xxxxxxx","xxxxxxx","xxxxxxx","xxxxxxx"],
  ["...x...","..xxx..",".xxxxx.","xxxxxxx","xxxxxxx"],
  ["x.x.x.x",".x.x.x.","x.x.x.x",".x.x.x.","x.x.x.x"],
  ["#xxxxx#","x#xxx#x","xxxxxxx","xx###xx","xxxxxxx"],
  ["x#x.x#x","x#x.x#x","xxx.xxx","x.xxx.x","xxxxxxx"],
  ["...#...","..xxx..",".x###x.","..xxx..","...x..."]
];
const COLORS=["#f43f5e","#fb923c","#facc15","#4ade80","#38bdf8"];
const PU={W:{c:"#a78bfa"},L:{c:"#f43f5e"},S:{c:"#4ade80"}};
let diff='medium',hi=loadHi(),state='ready',score=0,lives=3,level=1;
let bricks=[],ball={x:0,y:0,vx:0,vy:0},speed=4,px=0,pw=80,basePw=80,ph=10,py=H-24,r=7;
let drops=[],parts=[],wideT=0,slowT=0,left=false,right=false,last=0,shake=0,descendT=0;

function loadHi(){try{return +localStorage.getItem('bb_hi_'+diff)||0}catch(e){return 0}}
function saveHi(){try{localStorage.setItem('bb_hi_'+diff,hi)}catch(e){}}

function newLevel(){
  const D=DIFF[diff];bricks=[];descendT=D.descend;
  basePw=Math.max(44,D.pw-(level-1)*D.shrink);
  const L=LAYOUTS[(level-1)%LAYOUTS.length];
  const bw=60,bh=16,pad=8,ox=26,oy=44;
  for(let row=0;row<5;row++)for(let c=0;c<7;c++){
    let ch=L[row][c];
    if(ch==='#'&&D.unb<1&&(c+row)%2===0)ch='x';
    if(ch==='x'&&D.unb>1&&level>=2&&row===2&&(c===0||c===6))ch='#';
    if(ch==='.')continue;
    const x=c*(bw+pad)+ox,y=row*(bh+pad)+oy;
    if(ch==='#'){bricks.push({x,y,w:bw,h:bh,hp:1,max:1,unb:true});continue}
    let hp=row<2?2:1;
    if(level>2&&row===0)hp=3;
    hp+=D.hpAdd<0?D.hpAdd:(row<3?D.hpAdd:0);
    hp=Math.max(1,Math.min(4,hp));
    bricks.push({x,y,w:bw,h:bh,hp,max:hp,color:COLORS[row]});
  }
}
function setBall(){
  state='ready';drops=[];
  ball.x=px+pw/2;ball.y=py-r-1;ball.vx=ball.vy=0;
}
function fullReset(){
  const d=DIFF[diff];basePw=pw=d.pw;lives=d.l;score=0;level=1;speed=d.s;
  wideT=slowT=0;px=(W-pw)/2;newLevel();setBall();
  document.getElementById('hint').textContent=HINTS[diff];
}
function launch(){
  if(state==='ready'){
    const a=(Math.random()*40-20)*Math.PI/180;
    ball.vx=speed*Math.sin(a);ball.vy=-speed*Math.cos(a);state='playing';
  }else if(state==='over')fullReset();
}
function togglePause(){
  if(state==='playing')state='paused';else if(state==='paused')state='playing';
}

// Input
addEventListener('keydown',e=>{
  if(['ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();
  if(e.key==='ArrowLeft')left=true;
  if(e.key==='ArrowRight')right=true;
  if(e.key===' ')launch();
  if(e.key==='p'||e.key==='P')togglePause();
});
addEventListener('keyup',e=>{
  if(e.key==='ArrowLeft')left=false;
  if(e.key==='ArrowRight')right=false;
});
function moveTo(clientX){
  const rect=cv.getBoundingClientRect();
  const x=(clientX-rect.left)*(W/rect.width);
  px=Math.max(0,Math.min(W-pw,x-pw/2));
}
cv.addEventListener('mousemove',e=>moveTo(e.clientX));
cv.addEventListener('touchmove',e=>{moveTo(e.touches[0].clientX)},{passive:true});
cv.addEventListener('touchstart',e=>{moveTo(e.touches[0].clientX);launch()},{passive:true});
cv.addEventListener('mousedown',launch);
document.getElementById('difficulty').addEventListener('change',e=>{
  diff=e.target.value;hi=loadHi();fullReset();e.target.blur();
});
document.getElementById('resetHi').addEventListener('click',()=>{
  try{localStorage.removeItem('bb_hi_'+diff)}catch(err){}hi=0;
});

function burst(x,y,color){
  for(let i=0;i<8;i++){
    const a=Math.random()*Math.PI*2,s=1+Math.random()*2.5;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:30,color});
  }
}
function addScore(n){score+=n;if(score>hi){hi=score;saveHi()}}

function update(dt){
  if(left)px-=7*dt;if(right)px+=7*dt;
  pw=wideT>0?basePw*1.5:basePw;
  px=Math.max(0,Math.min(W-pw,px));
  if(wideT>0)wideT-=dt;if(slowT>0)slowT-=dt;

  parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt});
  parts=parts.filter(p=>p.life>0);
  if(shake>0)shake-=dt;

  if(state==='ready'){ball.x=px+pw/2;ball.y=py-r-1;return}
  if(state!=='playing')return;

  const k=dt*(slowT>0?0.65:1);
  ball.x+=ball.vx*k;ball.y+=ball.vy*k;

  // walls
  if(ball.x<r){ball.x=r;ball.vx=Math.abs(ball.vx)}
  if(ball.x>W-r){ball.x=W-r;ball.vx=-Math.abs(ball.vx)}
  if(ball.y<r){ball.y=r;ball.vy=Math.abs(ball.vy)}

  // paddle: bounce angle depends on where it hits
  if(ball.vy>0&&ball.y+r>=py&&ball.y-r<=py+ph&&ball.x>=px-r&&ball.x<=px+pw+r){
    const hit=Math.max(-1,Math.min(1,(ball.x-(px+pw/2))/(pw/2)));
    const a=hit*60*Math.PI/180;
    ball.vx=speed*Math.sin(a);ball.vy=-speed*Math.cos(a);ball.y=py-r;
  }

  // bricks: circle vs rectangle
  for(const b of bricks){
    if(b.hp<=0)continue;
    const cx=Math.max(b.x,Math.min(ball.x,b.x+b.w)),cy=Math.max(b.y,Math.min(ball.y,b.y+b.h));
    const dx=ball.x-cx,dy=ball.y-cy;
    if(dx*dx+dy*dy<r*r){
      if(dx===0&&dy===0)ball.vy=-ball.vy;
      else if(Math.abs(dx)>Math.abs(dy))ball.vx=(dx>0?1:-1)*Math.abs(ball.vx);
      else ball.vy=(dy>0?1:-1)*Math.abs(ball.vy);
      if(b.unb){shake=4;break}
      b.hp--;addScore(10);
      speed=Math.min(speed+DIFF[diff].ramp,DIFF[diff].s+3);
      if(b.hp<=0){
        burst(b.x+b.w/2,b.y+b.h/2,b.color);
        if(Math.random()<DIFF[diff].drop){
          const t='WLS'[Math.floor(Math.random()*3)];
          drops.push({x:b.x+b.w/2,y:b.y,t});
        }
      }
      break;
    }
  }

  // ball lost
  if(ball.y>H+r){
    lives--;shake=12;
    if(lives<=0)state='over';else setBall();
  }

  // level cleared
  const D=DIFF[diff];
  if(D.descend&&state==='playing'){
    descendT-=dt;
    if(descendT<=0){
      descendT=D.descend;shake=8;
      bricks.forEach(b=>{b.y+=16});
      if(bricks.some(b=>(b.unb||b.hp>0)&&b.y+b.h>=py-6))state='over';
    }
  }
  if(state==='playing'&&bricks.every(b=>b.unb||b.hp<=0)){level++;speed=D.s+Math.min(level-1,6)*D.lv;newLevel();setBall()}
}

function updateDrops(dt){
  for(const d of drops){
    d.y+=1.6*dt;
    if(d.y>py-8&&d.y<py+ph&&d.x>px&&d.x<px+pw){
      d.dead=true;
      if(d.t==='W')wideT=600;
      if(d.t==='L')lives=Math.min(lives+1,9);
      if(d.t==='S')slowT=480;
      addScore(25);
    }
    if(d.y>H)d.dead=true;
  }
  drops=drops.filter(d=>!d.dead);
}

function draw(){
  ctx.save();
  ctx.clearRect(0,0,W,H);
  if(shake>0)ctx.translate((Math.random()-.5)*6,(Math.random()-.5)*6);

  for(const b of bricks){
    if(b.hp<=0)continue;
    if(b.unb){
      ctx.globalAlpha=1;ctx.fillStyle="#64748b";ctx.fillRect(b.x,b.y,b.w,b.h);
      ctx.strokeStyle="#cbd5e1";ctx.lineWidth=2;ctx.strokeRect(b.x+1,b.y+1,b.w-2,b.h-2);
      continue;
    }
    ctx.globalAlpha=0.45+0.55*(b.hp/b.max);
    ctx.fillStyle=b.color;
    ctx.fillRect(b.x,b.y,b.w,b.h);
  }
  ctx.globalAlpha=1;

  parts.forEach(p=>{ctx.globalAlpha=p.life/30;ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,3,3)});
  ctx.globalAlpha=1;

  drops.forEach(d=>{
    ctx.fillStyle=PU[d.t].c;ctx.beginPath();ctx.arc(d.x,d.y,9,0,7);ctx.fill();
    ctx.fillStyle="#0f172a";ctx.font="bold 11px Segoe UI";ctx.textAlign="center";ctx.fillText(d.t,d.x,d.y+4);
  });

  ctx.fillStyle=wideT>0?"#a78bfa":"#38bdf8";
  ctx.fillRect(px,py,pw,ph);

  ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(ball.x,ball.y,r,0,7);ctx.fill();

  ctx.font="14px Segoe UI";ctx.fillStyle="#fff";
  ctx.textAlign="left";ctx.fillText("Score: "+score,10,22);
  ctx.textAlign="center";ctx.fillText("Level "+level+"  ·  Lives: "+"♥".repeat(lives),W/2,22);
  ctx.textAlign="right";ctx.fillText("Best: "+hi,W-10,22);
  if(DIFF[diff].descend){ctx.fillStyle="#f43f5e";ctx.fillRect(0,30,W*Math.max(0,descendT)/DIFF[diff].descend,3)}
  ctx.restore();

  if(state!=='playing'){
    ctx.fillStyle="rgba(15,23,42,.6)";ctx.fillRect(0,0,W,H);
    ctx.fillStyle="#fff";ctx.textAlign="center";
    ctx.font="bold 26px Segoe UI";
    const t=state==='over'?"GAME OVER":state==='paused'?"PAUSED":"Level "+level;
    ctx.fillText(t,W/2,H/2-6);
    ctx.font="14px Segoe UI";ctx.fillStyle="#94a3b8";
    ctx.fillText(state==='over'?"Click or press Space to play again":state==='paused'?"Press P to resume":"Click or press Space to launch",W/2,H/2+20);
  }
}

function loop(t){
  const dt=Math.min((t-last)/16.667||1,2.5);last=t; // frame-rate independent
  update(dt);updateDrops(state==='playing'?dt:0);draw();
  requestAnimationFrame(loop);
}
fullReset();
requestAnimationFrame(loop);
</script>
</body>
</html>
