<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Universal Converter</title>
<style>
:root{--bg:#f1f5f9;--card:#fff;--bd:#cbd5e1;--fg:#0f172a;--mut:#64748b;--acc:#0284c7;--accfg:#fff;--ok:#059669;--warn:#d97706;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f172a;--card:#1e293b;--bd:#334155;--fg:#f8fafc;--mut:#94a3b8;--acc:#38bdf8;--accfg:#0f172a;--ok:#4ade80;--warn:#fbbf24}}
:root[data-theme="dark"]{--bg:#0f172a;--card:#1e293b;--bd:#334155;--fg:#f8fafc;--mut:#94a3b8;--acc:#38bdf8;--accfg:#0f172a;--ok:#4ade80;--warn:#fbbf24}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;padding:32px 16px;min-height:100vh}
.wrap{max-width:650px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:20px}
h1{margin:0;color:var(--acc);font-size:1.8rem}
header p{margin:4px 0 0;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:20px;margin-bottom:16px}
input,select,button{font:inherit;color:var(--fg)}
input,select{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:9px 10px;min-width:0}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
button{background:transparent;border:1px solid var(--bd);border-radius:8px;padding:8px 14px;cursor:pointer}
button:hover{border-color:var(--acc)}
.primary{background:var(--acc);color:var(--accfg);border-color:var(--acc);font-weight:700}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{flex:1 1 auto;color:var(--mut);font-weight:600}
.tabs button.on{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
.status{font-size:.82rem;display:flex;justify-content:center;align-items:center;gap:8px;margin-bottom:14px;color:var(--mut)}
.status.ok{color:var(--ok)}.status.warn{color:var(--warn)}
.status button{padding:2px 8px;font-size:.78rem}
.grid{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:end;margin-bottom:16px}
@media(max-width:520px){.grid{grid-template-columns:1fr}.swap{justify-self:center}}
label{display:block;font-size:.8rem;font-weight:700;color:var(--mut);margin-bottom:4px}
.grid select{margin-bottom:8px}
.swap{border-radius:50%;width:40px;height:40px;padding:0;font-size:1.1rem;color:var(--acc)}
.result{border:2px dashed var(--acc);border-radius:10px;padding:14px;text-align:center;margin-bottom:12px}
.result small{color:var(--mut)}
#resultText{margin:4px 0;font-size:1.5rem;font-weight:700;color:var(--acc);overflow-wrap:anywhere}
#rateLine{color:var(--mut);font-size:.85rem;min-height:1.2em}
.actions{display:flex;gap:8px}.actions button{flex:1}
.hhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.hhead h2{margin:0;font-size:1rem;color:var(--acc)}
.link{border:none;color:var(--mut);padding:2px 6px}
ul{list-style:none;margin:0;padding:0}
ul button{width:100%;text-align:left;border:none;border-bottom:1px solid var(--bd);border-radius:0;padding:9px 4px;font-size:.9rem}
ul li:last-child button{border-bottom:none}
.empty{text-align:center;color:var(--mut);padding:8px;font-size:.9rem}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>⇄ Universal Converter</h1><p>Currencies, length, weight, temperature, speed and volume</p></div>
    <button id="theme" title="Toggle theme" aria-label="Toggle theme">◐</button>
  </header>

  <div class="card">
    <div class="tabs" id="tabs" role="group" aria-label="Category"></div>
    <div class="status" id="status"></div>

    <div class="grid">
      <div>
        <label for="fromUnit">From</label>
        <select id="fromUnit"></select>
        <input type="number" id="fromValue" value="1" step="any" inputmode="decimal" aria-label="Value to convert">
      </div>
      <button class="swap" id="swap" title="Swap units (S)" aria-label="Swap units">⇄</button>
      <div>
        <label for="toUnit">To</label>
        <select id="toUnit"></select>
        <input type="text" id="toValue" readonly placeholder="Result" aria-label="Result">
      </div>
    </div>

    <div class="result" aria-live="polite">
      <small>Result</small>
      <div id="resultText">--</div>
      <div id="rateLine"></div>
    </div>
    <div class="actions">
      <button id="copy">Copy result</button>
      <button class="primary" id="save">Save conversion</button>
    </div>
  </div>

  <div class="card">
    <div class="hhead"><h2>History</h2><button class="link" id="clearHist">Clear</button></div>
    <ul id="history"></ul>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const U=a=>a.map(([id,f])=>({id,f}));
const CATS={
  currency:{label:'💱 Currency'},
  length:{label:'📏 Length',units:U([['mm',.001],['cm',.01],['m',1],['km',1000],['in',.0254],['ft',.3048],['yd',.9144],['mi',1609.344]])},
  weight:{label:'⚖️ Weight',units:U([['mg',1e-6],['g',.001],['kg',1],['tonne',1000],['oz',.028349523125],['lb',.45359237],['stone',6.35029318]])},
  temperature:{label:'🌡️ Temp',units:U([['Celsius',0],['Fahrenheit',0],['Kelvin',0]])},
  speed:{label:'🚀 Speed',units:U([['m/s',1],['km/h',1/3.6],['mph',.44704],['knots',.5144444],['ft/s',.3048]])},
  volume:{label:'🧪 Volume',units:U([['mL',.001],['L',1],['tsp',.00492892159375],['tbsp',.01478676478125],['cup',.2365882365],['fl oz',.0295735295625],['gallon (US)',3.785411784],['m³',1000]])}
};
const POPULAR=['USD','EUR','GBP','JPY','PHP','CAD','AUD','SGD','CNY','HKD','KRW','INR'];
let rates={USD:1,EUR:.92,GBP:.79,JPY:155.2,PHP:58.5,CAD:1.36,AUD:1.51,SGD:1.35,CNY:7.25,HKD:7.8,KRW:1370,INR:83.5};
let rateInfo={src:'builtin',time:null};
let cat='currency',prefs=lsGet('converterPrefs',{}),history=lsGet('converterHistoryV2',[]);
if(!Array.isArray(history))history=[];

function lsGet(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v??d}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function h(tag,props={},...kids){
  const e=document.createElement(tag);
  for(const k in props){
    if(k==='class')e.className=props[k];
    else if(k.startsWith('on'))e.addEventListener(k.slice(2),props[k]);
    else if(k.includes('-'))e.setAttribute(k,props[k]);
    else e[k]=props[k];
  }
  kids.forEach(x=>e.append(x));return e;
}

/* ---------- units ---------- */
let names=null;try{names=new Intl.DisplayNames(undefined,{type:'currency'})}catch(e){}
function unitList(){
  if(cat==='currency'){
    const all=Object.keys(rates);
    return POPULAR.filter(c=>rates[c]).concat(all.filter(c=>!POPULAR.includes(c)).sort());
  }
  return CATS[cat].units.map(u=>u.id);
}
function unitLabel(u){
  if(cat!=='currency'||!names)return u;
  try{return u+' – '+names.of(u)}catch(e){return u}
}
function fillSelect(sel,list,value){
  sel.replaceChildren(...list.map(u=>h('option',{value:u,textContent:unitLabel(u)})));
  if(list.includes(value))sel.value=value;
}
function toCelsius(v,f){return f==='Fahrenheit'?(v-32)*5/9:f==='Kelvin'?v-273.15:v}
function fromCelsius(c,t){return t==='Fahrenheit'?c*9/5+32:t==='Kelvin'?c+273.15:c}
function convertVal(v,from,to){
  if(cat==='temperature')return fromCelsius(toCelsius(v,from),to);
  if(cat==='currency')return v/rates[from]*rates[to];
  const f=Object.fromEntries(CATS[cat].units.map(u=>[u.id,u.f]));
  return v*f[from]/f[to];
}
function fmt(n){
  if(!isFinite(n))return '--';
  if(n===0)return '0';
  const a=Math.abs(n);
  if(a>=1e15||a<1e-6)return n.toExponential(4);
  return n.toLocaleString(undefined,{maximumFractionDigits:a<1?6:4});
}

/* ---------- main ---------- */
function convert(){
  const raw=$('fromValue').value,v=parseFloat(raw),from=$('fromUnit').value,to=$('toUnit').value;
  let text='--';
  $('toValue').value='';$('rateLine').textContent='';
  if(raw!==''&&!isNaN(v)){
    if(cat==='temperature'&&toCelsius(v,from)<-273.15){
      text='Below absolute zero';
    }else{
      const out=fmt(convertVal(v,from,to));
      $('toValue').value=out;
      text=`${fmt(v)} ${from} = ${out} ${to}`;
      $('rateLine').textContent=cat==='temperature'?'':`1 ${from} = ${fmt(convertVal(1,from,to))} ${to}`;
    }
  }
  $('resultText').textContent=text;
  prefs.cat=cat;prefs.value=raw;(prefs.sel=prefs.sel||{})[cat]=[from,to];lsSet('converterPrefs',prefs);
}
function setCategory(c,keep){
  cat=c;
  [...$('tabs').children].forEach(b=>{const on=b.dataset.cat===c;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on)});
  const list=unitList(),saved=(prefs.sel||{})[c]||[];
  const from=keep?$('fromUnit').value:saved[0]||list[0];
  const to=keep?$('toUnit').value:saved[1]||(c==='currency'?'EUR':list[1]);
  fillSelect($('fromUnit'),list,from);fillSelect($('toUnit'),list,to);
  $('status').style.display=c==='currency'?'flex':'none';
  convert();
}

/* ---------- live rates ---------- */
function showStatus(){
  const s=$('status');s.replaceChildren();
  const when=rateInfo.time?new Date(rateInfo.time).toLocaleString(undefined,{dateStyle:'medium',timeStyle:'short'}):'';
  const msg={live:'● Live rates · updated '+when,cached:'● Saved rates from '+when+' (offline)',builtin:'● Approximate built-in rates (offline)',loading:'Updating rates…'}[rateInfo.src];
  s.className='status '+(rateInfo.src==='live'?'ok':rateInfo.src==='loading'?'':'warn');
  s.append(msg,h('button',{type:'button',onclick:fetchRates},'Refresh'));
}
async function fetchRates(){
  const prevSrc=rateInfo.src;rateInfo.src='loading';showStatus();
  try{
    const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),8000);
    const res=await fetch('https://open.er-api.com/v6/latest/USD',{signal:ctl.signal});clearTimeout(t);
    if(!res.ok)throw new Error('HTTP '+res.status);
    const data=await res.json();
    if(!data.rates||!data.rates.USD)throw new Error('Bad data');
    rates=data.rates;
    rateInfo={src:'live',time:(data.time_last_update_unix||Date.now()/1000)*1000};
    lsSet('converterRates',{rates,time:rateInfo.time});
    if(cat==='currency')setCategory('currency',true);
  }catch(e){
    rateInfo.src=prevSrc==='loading'?'builtin':prevSrc==='live'?'cached':prevSrc;
  }
  showStatus();
}

/* ---------- history ---------- */
function renderHistory(){
  const ul=$('history');ul.replaceChildren();
  if(!history.length){ul.append(h('li',{class:'empty'},'No saved conversions yet'));return}
  history.forEach(it=>ul.append(h('li',{},h('button',{title:'Click to reload',onclick:()=>{
    prefs.sel=prefs.sel||{};prefs.sel[it.cat]=[it.from,it.to];$('fromValue').value=it.val;setCategory(it.cat);
  }},'↺  '+it.text))));
}
function saveHistory(){
  const text=$('resultText').textContent;
  if(text==='--'||text==='Below absolute zero')return;
  history=history.filter(x=>x.text!==text);
  history.unshift({text,cat,from:$('fromUnit').value,to:$('toUnit').value,val:$('fromValue').value});
  history=history.slice(0,8);lsSet('converterHistoryV2',history);renderHistory();
}

/* ---------- wiring ---------- */
$('tabs').replaceChildren(...Object.entries(CATS).map(([k,c])=>h('button',{type:'button','data-cat':k,onclick:()=>setCategory(k)},c.label)));
$('fromValue').addEventListener('input',convert);
$('fromUnit').addEventListener('change',convert);
$('toUnit').addEventListener('change',convert);
$('swap').addEventListener('click',()=>{const a=$('fromUnit').value;$('fromUnit').value=$('toUnit').value;$('toUnit').value=a;convert()});
$('save').addEventListener('click',saveHistory);
$('copy').addEventListener('click',async()=>{
  const t=$('toValue').value;if(!t)return;
  try{await navigator.clipboard.writeText(t);$('copy').textContent='Copied!'}catch(e){$('copy').textContent='Copy failed'}
  setTimeout(()=>$('copy').textContent='Copy result',1200);
});
$('clearHist').addEventListener('click',()=>{history=[];lsSet('converterHistoryV2',[]);renderHistory()});
$('theme').addEventListener('click',()=>{
  const r=document.documentElement;
  const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
  r.dataset.theme=dark?'light':'dark';
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='fromValue')saveHistory();
});

/* ---------- init ---------- */
const cache=lsGet('converterRates',null);
if(cache&&cache.rates&&cache.rates.USD){rates=cache.rates;rateInfo={src:'cached',time:cache.time}}
if(prefs.value!==undefined)$('fromValue').value=prefs.value;
setCategory(CATS[prefs.cat]?prefs.cat:'currency');
renderHistory();showStatus();fetchRates();
</script>
</body>
</html>
